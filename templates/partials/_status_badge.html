{% if trip.status == "PLANNING" %}
<span class="badge badge--warning"><span aria-hidden="true">◷</span> Planning</span>
{% elif trip.status == "DECIDED" %}
<span class="badge badge--success"><span aria-hidden="true">✓</span> Decided</span>
{% else %}
<span class="badge badge--neutral"><span aria-hidden="true">✕</span> Cancelled</span>
{% endif %}
