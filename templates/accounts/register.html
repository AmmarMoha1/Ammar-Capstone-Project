{% extends "base.html" %}

{% block title %}
Register | Wajha
{% endblock %}

{% block content %}

<h1>Create Account</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Create Account
    </button>
</form>

<p>
    Already have an account?
    <a href="{% url 'accounts:login' %}">
        Login
    </a>
</p>

{% endblock %}
