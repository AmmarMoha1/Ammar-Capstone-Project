{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<section class="error-page">
    <p class="error-page__code">404</p>
    <h1>We couldn't find that page</h1>
    <p class="muted">The link may be wrong, or the trip may not exist. If it's a trip, you need to be a member to see it.</p>
    <div class="actions">
        <a class="btn btn--primary" href="{% url 'trips:home' %}">Go to my trips</a>
        <a class="btn btn--secondary" href="{% url 'trips:join' %}">Join a trip with a code</a>
    </div>
</section>
{% endblock %}
